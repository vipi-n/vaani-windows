name: Build Vaani (Windows)

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Find Vaani.csproj wherever it lives (repo root or a subfolder like windows/).
      - name: Locate project
        id: proj
        shell: bash
        run: |
          CSPROJ=$(find . -iname 'Vaani.csproj' | head -1)
          if [ -z "$CSPROJ" ]; then
            echo "::error::Vaani.csproj not found in the repo. .csproj files present:"
            find . -name '*.csproj' || true
            exit 1
          fi
          DIR=$(dirname "$CSPROJ")
          echo "csproj=$CSPROJ" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $CSPROJ (dir: $DIR)"

      # The Whisper model is large; cache it between runs.
      - name: Cache Whisper model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.proj.outputs.dir }}/models/ggml-small.bin
          key: vaani-whisper-small-v1

      - name: Download Whisper model
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "${{ steps.proj.outputs.dir }}/models"
          curl -L --fail -o "${{ steps.proj.outputs.dir }}/models/ggml-small.bin" \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin?download=true"
          ls -lh "${{ steps.proj.outputs.dir }}/models"

      - name: Restore
        run: dotnet restore "${{ steps.proj.outputs.csproj }}"

      - name: Publish (self-contained single-file .exe)
        run: >
          dotnet publish "${{ steps.proj.outputs.csproj }}"
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Ensure model is beside the exe
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/ggml-small.bin")) {
            Copy-Item "${{ steps.proj.outputs.dir }}/models/ggml-small.bin" "publish/ggml-small.bin"
          }
          Get-ChildItem publish | Select-Object Name, Length

      - name: Zip build
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath Vaani-Windows.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vaani-Windows
          path: Vaani-Windows.zip

      # When you push a version tag (e.g. v1.0.0), also publish a Release
      # with the zip attached, so the download page can link to it.
      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Vaani-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
